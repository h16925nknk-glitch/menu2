<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BOYOROU Menu Admin</title>
  <link rel="stylesheet" href="admin.css" />
</head>
<body>
 <header class="admin-header">
  <div>
    <p class="kicker">BOYOROU MENU CMS</p>

    <h1>メニュー管理画面</h1>

    <p class="lead">
      料理・カテゴリーの追加、並び替え、価格変更、売り切れ設定を行います。
    </p>
  </div>

  <a class="preview-link"
     href="index.html"
     target="_blank"
     rel="noopener">
     🌐 公開メニューを見る
  </a>
</header>
  <main class="admin-layout">
    <section class="auth-panel" id="authPanel">
      <strong>管理者ログイン</strong><br>
      <input id="email" type="email" placeholder="メールアドレス" autocomplete="username">
      <input id="password" type="password" placeholder="パスワード" autocomplete="current-password">
      <button type="button" id="loginBtn">ログイン</button>
      <button type="button" id="logoutBtn">ログアウト</button>
      <p id="authStatus" aria-live="polite"></p>
    </section>
    <section class="toolbar" aria-label="管理操作">

  <button id="saveBtn" class="primary" type="button">
      💾 変更を更新
  </button>

  <button id="downloadBtn" type="button">
      📥 バックアップ
  </button>

  <button id="resetBtn" type="button">
      ↩ 元に戻す
  </button>

  <button id="addSectionBtn" type="button">
      ＋ カテゴリー追加
  </button>

</section>

    <p id="status" class="status" aria-live="polite"></p>
    <div id="editor"></div>
  </main>

  <template id="sectionTemplate">
    <section class="section-card">
      <div class="section-topline">
        <span class="drag-note">カテゴリー</span>
        <button type="button" class="delete-section danger-ghost">カテゴリーを削除</button>
      </div>

      <div class="field-grid section-fields">
        <label>
          英語カテゴリー名
          <input class="section-title" type="text" placeholder="Seasonal Sashimi" />
        </label>
        <label>
          ID（半角英数字）
          <input class="section-id" type="text" placeholder="sashimi" />
        </label>
        <label class="full">
          英語説明文
          <textarea class="section-description" rows="2" placeholder="Fresh seafood..."></textarea>
        </label>
      </div>

      <div class="items-head">
        <h2>料理</h2>
        <button type="button" class="add-item primary-small">＋ 料理を追加</button>
      </div>
      <div class="items"></div>
    </section>
  </template>

  <template id="itemTemplate">
    <article class="item-editor">
      <div class="field-grid item-fields">
        <label class="name-field">
          英語料理名
          <input class="item-name" type="text" placeholder="Sea Urchin" />
        </label>
        <label>
          産地・注意書き
          <input class="item-meta" type="text" placeholder="Mikuni" />
        </label>
        <label>
          価格（数字のみ）
          <input class="item-price" type="number" min="0" step="10" placeholder="4400" />
        </label>
        <label class="check-label">
          <input class="item-soldout" type="checkbox" />
          売り切れ
        </label>
        <label class="check-label">
          <input class="item-hidden" type="checkbox" />
          非表示
        </label>
      </div>
      <div class="photo-actions">
        <label>料理写真 <input class="item-photo-file" type="file" accept="image/jpeg,image/png,image/webp,image/heic,image/heif"></label>
        <button type="button" class="remove-photo">写真を削除</button>
        <img class="photo-preview" alt="料理写真" hidden>
      </div>
      <button type="button" class="delete-item danger-ghost">この料理を削除</button>
    </article>
  </template>

  <script src="menu-data.js"></script>
  <script type="module" src="admin.js"></script>
</body>
</html>
